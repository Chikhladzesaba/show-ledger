<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ledger</title>
  <meta name="description" content="Track your income and costs by month, quarter and year.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

  <style>
    /* ===== Design tokens ===== */
    :root {
      --ink: #1a1b22;
      --accent: #006aff;
      --border: #c5dcf0;
      --bg: #f7fbff;
      --surface: #ffffff;
      --line: #e6e7eb;
      --muted: #5f616b;
      --good: #0b7a3e;
      --danger: #c0392b;
      --sans: "Inter Tight", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== Header ===== */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { font-size: 26px; font-weight: 500; margin: 0; }
    .brand em { font-family: var(--serif); font-size: 30px; font-weight: 400; }
    .subtitle { margin: 4px 0 0; font-size: 15px; color: var(--muted); }

    /* ===== Buttons ===== */
    button {
      height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font: 500 15px var(--sans);
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    /* ===== Cards ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card h2 { margin: 0 0 16px; font-size: 20px; font-weight: 500; }
    .empty { color: var(--muted); font-style: italic; margin: 0; }

    /* ===== Add entry panel ===== */
    #entry-panel { max-width: 560px; width: 100%; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-head h2 { margin: 0; }

    #entry-form { display: flex; flex-direction: column; gap: 20px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row .field { flex: 1 1 140px; }

    input, select {
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: 16px var(--sans);
      color: var(--ink);
      background: var(--surface);
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .amount-input { height: 60px; font-size: 28px; font-weight: 500; }

    /* Money in / Money out switch */
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .segmented button { background: transparent; color: var(--muted); }
    .segmented button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }

    /* Stream / category chips */
    fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    legend { padding: 0; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 0 16px;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .hint { font-size: 13px; }

    /* ===== Tables ===== */
    #entries-list { overflow-x: auto; }
    table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 13px; font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    .number { text-align: right; }
    .muted { color: var(--muted); }
