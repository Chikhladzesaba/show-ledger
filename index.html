<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ledger</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; margin-top: 0; }
    section {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 20px;
    }
    section h2 { margin-top: 0; font-size: 1.2rem; }
    .empty { color: #999; font-style: italic; }

    /* Forms */
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #555;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      font-size: 0.95rem;
    }
    button {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #333; }

    /* Tables */
    #episode-list { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
    th { color: #666; font-weight: 600; font-size: 0.85rem; }
    .number { text-align: right; }
    button.delete { background: none; color: #c0392b; padding: 4px 8px; }
    button.delete:hover { background: #fdecea; }
  </style>
</head>
<body>
  <h1>Show Ledger</h1>
  <p class="subtitle">See what each episode really earns. Your numbers stay in this browser.</p>

  <section id="episodes">
    <h2>Episodes</h2>
    <form id="episode-form">
      <label>
        Title
        <input type="text" id="episode-title" required>
      </label>
      <label>
        Publish date
        <input type="date" id="episode-date" required>
      </label>
      <label>
        Production cost (USD)
        <input type="number" id="episode-cost" min="0" step="0.01" value="0">
      </label>
      <button type="submit">Add episode</button>
    </form>
    <div id="episode-list"></div>
  </section>

  <section id="revenue">
    <h2>Revenue entries</h2>
    <p class="empty">No revenue entries yet.</p>
  </section>

  <section id="summary">
    <h2>Summary</h2>
    <p class="empty">Add episodes and revenue to see totals.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
