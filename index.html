<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ledger</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #666; margin-top: 0; }
    section {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 20px;
    }
    section h2 { margin-top: 0; font-size: 1.2rem; }
    .empty { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <h1>Show Ledger</h1>
  <p class="subtitle">See what each episode really earns. Your numbers stay in this browser.</p>

  <section id="episodes">
    <h2>Episodes</h2>
    <p class="empty">No episodes yet.</p>
  </section>

  <section id="revenue">
    <h2>Revenue entries</h2>
    <p class="empty">No revenue entries yet.</p>
  </section>

  <section id="summary">
    <h2>Summary</h2>
    <p class="empty">Add episodes and revenue to see totals.</p>
  </section>
</body>
</html>
