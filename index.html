<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ledger</title>
  <meta name="description" content="Track your income and costs by month, quarter and year.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

  <style>
    /* ===== Design tokens ===== */
    :root {
      --ink: #1a1b22;
      --accent: #006aff;
      --border: #c5dcf0;
      --bg: #f7fbff;
      --surface: #ffffff;
      --line: #e6e7eb;
      --muted: #5f616b;
      --good: #0b7a3e;
      --danger: #c0392b;
      --sans: "Inter Tight", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== Header ===== */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { font-size: 26px; font-weight: 500; margin: 0; }
    .brand em { font-family: var(--serif); font-size: 30px; font-weight: 400; }
    .subtitle { margin: 4px 0 0; font-size: 15px; color: var(--muted); }

    /* ===== Buttons ===== */
    button {
      height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font: 500 15px var(--sans);
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    /* ===== Cards ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card h2 { margin: 0 0 16px; font-size: 20px; font-weight: 500; }
    .empty { color: var(--muted); font-style: italic; margin: 0; }

    /* ===== Add entry panel ===== */
    #entry-panel { max-width: 560px; width: 100%; }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-head h2 { margin: 0; }

    #entry-form { display: flex; flex-direction: column; gap: 20px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row .field { flex: 1 1 140px; }

    input, select {
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: 16px var(--sans);
      color: var(--ink);
      background: var(--surface);
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .amount-input { height: 60px; font-size: 28px; font-weight: 500; }

    /* Money in / Money out switch */
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .segmented button { background: transparent; color: var(--muted); }
    .segmented button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }

    /* Stream / category chips */
    fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    legend { padding: 0; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 0 16px;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .hint { font-size: 13px; }
    /* ===== Period switch ===== */
    .period-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .period-types {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .period-types button {
      height: 36px;
      padding: 0 18px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
    }
    .period-types button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }
    .period-nav { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      width: 44px;
      padding: 0;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      font-size: 20px;
    }
    .period-label { min-width: 170px; text-align: center; font-size: 18px; font-weight: 500; }
    .period-label span { color: var(--muted); font-weight: 400; font-size: 15px; }

    /* ===== Summary tiles ===== */
    .tiles { display: flex; flex-wrap: wrap; gap: 16px; }
    .tile {
      flex: 1 1 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tile-label { font-size: 14px; color: var(--muted); }
    .tile-value { font-size: 32px; font-weight: 500; }
    .tile-change { font-size: 13px; color: var(--muted); min-height: 18px; }
    .up, .profit { color: var(--good); }
    .down, .loss { color: var(--danger); }
    /* ===== Tables ===== */
    #entries-list { overflow-x: auto; }
    table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 13px; font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    .number { text-align: right; }
    .muted { color: var(--muted); }
    .money-in { color: var(--good); }

    .badge { font-size: 13px; padding: 3px 10px; border-radius: 999px; }
    .badge.income { background: #e8f1ff; color: #0047b3; }
    .badge.cost { background: #eef0f3; color: #3d4654; }

    button.delete {
      height: 32px;
      padding: 0 12px;
      background: none;
      color: var(--danger);
    }
    button.delete:hover { background: #fdecea; opacity: 1; }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div>
        <h1 class="brand">Show <em>Ledger</em></h1>
        <p class="subtitle">Your income and costs over time. Your numbers stay in this browser.</p>
      </div>
      <button type="button" id="open-entry">+ Add entry</button>
    </header>

    <section id="entry-panel" class="card" hidden>
      <div class="panel-head">
        <h2>Add entry</h2>
        <button type="button" id="close-entry" class="secondary">Close</button>
      </div>

      <form id="entry-form">
        <div class="segmented" role="group" aria-label="Entry type">
          <button type="button" id="type-income" aria-pressed="true">Money in</button>
          <button type="button" id="type-cost" aria-pressed="false">Money out</button>
        </div>

        <label class="field">
          Amount (USD)
          <input type="number" id="entry-amount" class="amount-input" min="0" step="0.01" placeholder="0.00" required>
        </label>

        <div class="row">
          <label class="field">
            Which month is this for?
            <select id="entry-month"></select>
          </label>
          <label class="field">
            Year
            <select id="entry-year"></select>
          </label>
        </div>

        <fieldset>
          <legend id="category-legend">Where did it come from?</legend>
          <div class="chips" id="category-chips"></div>
          <label class="field" id="other-field" hidden>
            Name it
            <input type="text" id="other-name" placeholder="e.g. Merch, Live event, Grant">
            <span class="hint">It shows up in your reports under this name.</span>
          </label>
        </fieldset>

        <label class="field">
          Note (optional)
          <input type="text" id="entry-note" placeholder="e.g. Sponsor name">
        </label>

        <button type="submit" id="save-entry">Save income</button>
      </form>
    </section>
    <div class="period-bar">
      <div class="period-types" role="group" aria-label="Period type">
        <button type="button" data-type="month" aria-pressed="false">Month</button>
        <button type="button" data-type="quarter" aria-pressed="true">Quarter</button>
        <button type="button" data-type="year" aria-pressed="false">Year</button>
      </div>
      <div class="period-nav">
        <button type="button" id="period-prev" class="icon-button" aria-label="Previous period">‹</button>
        <span class="period-label" id="period-label"></span>
        <button type="button" id="period-next" class="icon-button" aria-label="Next period">›</button>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><span class="tile-label">Income</span><span class="tile-value" id="tile-income">—</span><span class="tile-change" id="change-income"></span></div>
      <div class="tile"><span class="tile-label">Costs</span><span class="tile-value" id="tile-costs">—</span><span class="tile-change" id="change-costs"></span></div>
      <div class="tile"><span class="tile-label">Profit</span><span class="tile-value" id="tile-profit">—</span><span class="tile-change" id="change-profit"></span></div>
      <div class="tile"><span class="tile-label">Return per $1 spent</span><span class="tile-value" id="tile-return">—</span><span class="tile-change" id="change-return"></span></div>
    </div>
    <section class="card">
      <h2 id="entries-title">Entries</h2>
      <div id="entries-list"></div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
