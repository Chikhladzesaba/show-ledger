<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Ledger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23006aff'/><path d='M10 22v-3M16 22v-7M22 22V11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round'/></svg>">
  <meta name="description" content="Track your income and costs by month, quarter and year.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

  <style>
    /* ===== Design tokens ===== */
    :root {
      --ink: #1a1b22;
      --accent: #006aff;
      --border: #c5dcf0;
      --bg: #f7fbff;
      --surface: #ffffff;
      --line: #e6e7eb;
      --muted: #5f616b;
      --good: #0b7a3e;
      --danger: #c0392b;
      --sans: "Inter Tight", system-ui, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      --radius: 16px;
      --drawer: 440px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: margin 0.25s ease;
    }

    /* On wide screens the dashboard moves left while the drawer is open */
    @media (min-width: 1100px) {
      body.drawer-open .page {
        margin-left: 24px;
        margin-right: calc(var(--drawer) + 24px);
      }
    }

    /* ===== Header ===== */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .brand { font-size: 26px; font-weight: 500; margin: 0; }
    .brand em { font-family: var(--serif); font-size: 30px; font-weight: 400; }
    .subtitle { margin: 4px 0 0; font-size: 15px; color: var(--muted); }

    /* ===== Buttons ===== */
    button {
      height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font: 500 15px var(--sans);
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ===== Cards ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card h2 { margin: 0 0 16px; font-size: 20px; font-weight: 500; }
    .empty { color: var(--muted); font-style: italic; margin: 0; }

    /* ===== Period switch ===== */
    .period-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .segmented-pill {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .segmented-pill button {
      height: 36px;
      padding: 0 18px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
    }
    .segmented-pill button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }
    .period-nav { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      width: 44px;
      padding: 0;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      font-size: 20px;
    }
    .period-label { min-width: 170px; text-align: center; font-size: 18px; font-weight: 500; }
    .period-label span { color: var(--muted); font-weight: 400; font-size: 15px; }

    /* ===== Summary tiles ===== */
    .tiles { display: flex; flex-wrap: wrap; gap: 16px; }
    .tile {
      flex: 1 1 160px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tile-label { font-size: 14px; color: var(--muted); }
    .tile-value { font-size: 30px; font-weight: 500; transition: color 0.2s; }
    .tile-change { font-size: 13px; color: var(--muted); min-height: 18px; }
    .up, .profit { color: var(--good); }
    .down, .loss { color: var(--danger); }

    /* ===== Monthly chart ===== */
    .card-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-head h2 { margin: 0; }
    .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .swatch.income { background: var(--accent); }
    .swatch.cost { background: #9aa9bb; }

    .chart-scroll { overflow-x: auto; }
    .chart {
      min-width: 560px;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 6px;
      align-items: end;
    }
    .month-col {
      height: auto;
      padding: 8px 0;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .month-col:hover { background: var(--bg); opacity: 1; }
    .month-col.dim { opacity: 0.4; }
    .month-col.dim:hover { opacity: 0.8; }
    .month-col.selected { color: var(--ink); font-weight: 600; }
    .bars { height: 160px; display: flex; align-items: flex-end; gap: 3px; }
    .bars i { width: 12px; border-radius: 4px 4px 0 0; display: block; transition: height 0.3s ease; }
    .bars .income { background: var(--accent); }
    .bars .cost { background: #9aa9bb; }
    .bars .none { background: var(--line); border-radius: 0; }
    .chart-hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); }

    /* ===== Breakdowns ===== */
    .split { display: flex; flex-wrap: wrap; gap: 16px; }
    .split .card { flex: 1 1 340px; }
    .stream { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .stream:last-child { margin-bottom: 0; }
    .stream-row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
    .own { color: var(--muted); font-size: 13px; }
    .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s ease; }
    .bar-fill.cost { background: #6b7a8c; }
    .sub-line { font-size: 13px; color: var(--muted); margin: -2px 0 0; }

    /* ===== Tables ===== */
    #entries-list { overflow-x: auto; }
    table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 13px; font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    .number { text-align: right; }
    .muted { color: var(--muted); }
    .money-in { color: var(--good); }
    .small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

    .badge { font-size: 13px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .badge.income { background: #e8f1ff; color: #0047b3; }
    .badge.cost { background: #eef0f3; color: #3d4654; }

    button.delete {
      height: 32px;
      padding: 0 12px;
      background: none;
      color: var(--danger);
    }
    button.delete:hover { background: #fdecea; opacity: 1; }

    /* ===== Add entry drawer ===== */
    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      margin: 0;
      width: min(var(--drawer), 100%);
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      padding: 0;
      border: 0;
      border-left: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      box-shadow: -12px 0 40px rgba(26, 27, 34, 0.08);
      overflow-y: auto;
    }
    .drawer[open] { animation: slide-in 0.25s ease-out; }
    .drawer::backdrop { background: rgba(26, 27, 34, 0.12); }
    @media (min-width: 1100px) {
      .drawer::backdrop { background: transparent; }
    }
    @keyframes slide-in {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .drawer[open] { animation: none; }
      .page { transition: none; }
    }

    .drawer-inner { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; }
    .drawer-head h2 { margin: 0; font-size: 22px; font-weight: 500; }

    #entry-form { display: flex; flex-direction: column; gap: 18px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row .field { flex: 1 1 120px; }

    input, select {
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: 16px var(--sans);
      color: var(--ink);
      background: var(--surface);
      width: 100%;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .amount-input { height: 56px; font-size: 26px; font-weight: 500; }

    /* Money in / Money out */
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .segmented button { background: transparent; color: var(--muted); }
    .segmented button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }

    .span-types { display: flex; width: 100%; }
    .span-types button { flex: 1; }

    fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    legend { padding: 0; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      height: 40px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 0 14px;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .hint { font-size: 13px; color: var(--muted); margin: 0; }
    .sub-chips .chip { height: 36px; font-size: 14px; padding: 0 12px; }
    .sub-chips .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }

    .save-row { position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 4px; }
    .save-row button { width: 100%; height: 50px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div>
        <h1 class="brand">Show <em>Ledger</em></h1>
        <p class="subtitle">Your income and costs over time. Your numbers stay in this browser.</p>
      </div>
      <button type="button" id="open-entry">+ Add entry</button>
    </header>

    <div class="period-bar">
      <div class="segmented-pill period-types" role="group" aria-label="Period type">
        <button type="button" data-type="month" aria-pressed="false">Month</button>
        <button type="button" data-type="quarter" aria-pressed="true">Quarter</button>
        <button type="button" data-type="year" aria-pressed="false">Year</button>
      </div>
      <div class="period-nav">
        <button type="button" id="period-prev" class="icon-button" aria-label="Previous period">‹</button>
        <span class="period-label" id="period-label"></span>
        <button type="button" id="period-next" class="icon-button" aria-label="Next period">›</button>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><span class="tile-label">Income</span><span class="tile-value" id="tile-income">—</span><span class="tile-change" id="change-income"></span></div>
      <div class="tile"><span class="tile-label">Costs</span><span class="tile-value" id="tile-costs">—</span><span class="tile-change" id="change-costs"></span></div>
      <div class="tile"><span class="tile-label">Profit</span><span class="tile-value" id="tile-profit">—</span><span class="tile-change" id="change-profit"></span></div>
      <div class="tile"><span class="tile-label">Return per $1 spent</span><span class="tile-value" id="tile-return">—</span><span class="tile-change" id="change-return"></span></div>
    </div>

    <section class="card">
      <div class="card-head">
        <h2 id="chart-title">By month</h2>
        <div class="legend">
          <span><i class="swatch income"></i>Income</span>
          <span><i class="swatch cost"></i>Costs</span>
        </div>
      </div>
      <div class="chart-scroll">
        <div class="chart" id="month-chart"></div>
      </div>
      <p class="chart-hint">Click a month to see it on its own.</p>
    </section>

    <div class="split">
      <section class="card">
        <h2>Income by stream</h2>
        <div id="income-breakdown"></div>
      </section>
      <section class="card">
        <h2>Costs by category</h2>
        <div id="cost-breakdown"></div>
      </section>
    </div>

    <section class="card">
      <h2 id="entries-title">Entries</h2>
      <div id="entries-list"></div>
    </section>

  </div>

  <!-- Add entry: a drawer that slides in from the right -->
  <dialog id="entry-drawer" class="drawer" aria-labelledby="drawer-title">
    <div class="drawer-inner">
      <div class="drawer-head">
        <h2 id="drawer-title">Add entry</h2>
        <button type="button" id="close-entry" class="secondary">Close</button>
      </div>

      <form id="entry-form">
        <div class="segmented" role="group" aria-label="Entry type">
          <button type="button" id="type-income" aria-pressed="true">Money in</button>
          <button type="button" id="type-cost" aria-pressed="false">Money out</button>
        </div>

        <label class="field">
          Amount (USD)
          <input type="number" id="entry-amount" class="amount-input" min="0" step="0.01" placeholder="0.00" required>
        </label>

        <fieldset>
          <legend>This is for</legend>
          <div class="segmented-pill span-types" role="group" aria-label="Entry covers">
            <button type="button" data-span="1" aria-pressed="true">A month</button>
            <button type="button" data-span="3" aria-pressed="false">A quarter</button>
            <button type="button" data-span="12" aria-pressed="false">A year</button>
          </div>
          <div class="row">
            <label class="field" id="month-field">
              Month
              <select id="entry-month"></select>
            </label>
            <label class="field" id="quarter-field" hidden>
              Quarter
              <select id="entry-quarter">
                <option value="1">Q1 · Jan–Mar</option>
                <option value="2">Q2 · Apr–Jun</option>
                <option value="3">Q3 · Jul–Sep</option>
                <option value="4">Q4 · Oct–Dec</option>
              </select>
            </label>
            <label class="field">
              Year
              <select id="entry-year"></select>
            </label>
          </div>
          <p class="hint" id="spread-hint"></p>
        </fieldset>

        <fieldset>
          <legend id="category-legend">Where did it come from?</legend>
          <div class="chips" id="category-chips"></div>
          <p class="hint" id="category-hint" hidden></p>
          <label class="field" id="other-field" hidden>
            Name it
            <input type="text" id="other-name" placeholder="e.g. Grant, Prize, Licensing">
            <span class="hint">It shows up in your reports under this name.</span>
          </label>
        </fieldset>

        <fieldset id="sub-fieldset" hidden>
          <legend id="sub-legend">Which platform?</legend>
          <div class="chips sub-chips" id="sub-chips"></div>
          <label class="field" id="sub-other-field" hidden>
            Name it
            <input type="text" id="sub-other-name" placeholder="">
          </label>
        </fieldset>

        <label class="field" id="brand-field" hidden>
          Brand
          <input type="text" id="entry-brand" list="brand-list" autocomplete="off" placeholder="The sponsor's name">
          <datalist id="brand-list"></datalist>
          <span class="hint">Past brands are suggested, so totals stay together.</span>
        </label>

        <label class="field">
          Note (optional)
          <input type="text" id="entry-note" placeholder="e.g. Episode 14 integration">
        </label>

        <div class="save-row">
          <button type="submit" id="save-entry">Save income</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
